substitutions:
  _LLM_PROVIDER: openai
  _SANDBOX_DISPLAY_NAME: Sandbox-cuviv-489714
  _AGENT_ENGINE_DISPLAY_NAME: cuviv-489714-agent-engine
  _LOCATION: us-central1
  _OPENAI_MODEL: gpt-5-mini
  _VECTOR_STORE_ID: vs_69b028cd6e688191b019b0bf47f1813e
  _LOCAL_KNOWLEDGE_ROOT: .knowledge_data

# Variables y secretos que provienen del `.env` se gestionan con
# `scripts/sync_secrets.py` (se montan en Cloud Run como --update-secrets).
# Aquí sólo quedan los valores no-.env y el secret OPENAI_API_KEY.

steps:
  # 1. Construir la imagen Docker (sin variables — se inyectan en runtime)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/strava-chat/strava-srv/strava-api:latest'
      - '.'

  # 2. Subir la imagen al Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/strava-chat/strava-srv/strava-api:latest']

  # 3. Desplegar en Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy strava-api \
          --image europe-west1-docker.pkg.dev/strava-chat/strava-srv/strava-api:latest \
          --region europe-west1 \
          --platform managed \
          --memory 2Gi \
          --allow-unauthenticated \
          --update-env-vars "LLM_PROVIDER=$_LLM_PROVIDER,SANDBOX_DISPLAY_NAME=$_SANDBOX_DISPLAY_NAME,AGENT_ENGINE_DISPLAY_NAME=$_AGENT_ENGINE_DISPLAY_NAME,PROJECT_ID=$PROJECT_ID,LOCATION=$_LOCATION,OPENAI_MODEL=$_OPENAI_MODEL,VECTOR_STORE_ID=$_VECTOR_STORE_ID,LOCAL_KNOWLEDGE_ROOT=$_LOCAL_KNOWLEDGE_ROOT" \
          --update-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest"

images:
  - 'europe-west1-docker.pkg.dev/strava-chat/strava-srv/strava-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
